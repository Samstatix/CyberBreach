name: CyberBreach CI

# Run the same checks for development pushes and pull requests into main.
on:
  push:
    branches:
      - main
      - milestone-1/react-foundation
      - milestone-2/game-progression
      - milestone-2/progression-system
      - milestone-3/operations-missions
      - milestone-4/lab-progression
      - milestone-5/linux-lab-path
      - milestone-6/platform-hardening
      - milestone-7-gameplay-integrity
      - milestone-8-community-teams
      - milestone-9-account-management
      - milestone-10-multi-discipline-labs
      - milestone-11-competitions
      - phase-12/security-and-platform-hardening
      - phase-13/automated-security-regression
      - phase-14/automated-security-regression
      - phase-15/cyro-learning-assistant
      - phase-16/cyro-accessibility-and-guardrails
      - phase-17/cyro-adaptive-teaching
      - phase-18/cyro-contextual-hints
      - phase-19/cyro-learning-preferences
      - phase-20/cyro-lesson-grounding
      - phase-21/cyro-learning-intelligence
      - phase-22/cyro-diagnostic-assessment
      - phase-23/cyro-remediation-paths
      - phase-24/cyro-adaptive-teaching
      - phase-25/guided-lab-exercises
      - phase-26/learning-activity-profile
      - phase-27/specialist-cyber-curriculum
      - phase-28/cyro-edge-hardening
      - phase-29/ollama-runtime-reliability
      - phase-30/release-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberbreach-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan public source for private answer material
        run: npm run security:scan

      - name: Test private-content security scanner
        run: npm run security:test

      # Bootstrap a lockfile once on the release branch, then keep it committed.
      - name: Generate release lockfile
        if: github.ref == 'refs/heads/phase-30/release-readiness'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.ref == 'refs/heads/phase-30/release-readiness'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock audited npm dependencies"
            git push
          fi

      - name: Install workspace dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate Supabase Edge Functions
        run: deno check --no-lock supabase/functions/cyro-assistant/index.ts supabase/functions/delete-account/index.ts

      - name: Type-check the React application
        run: npm run typecheck

      - name: Run curriculum and application tests
        run: npm test

      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Build the production frontend
        run: npm run build
